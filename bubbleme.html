<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BubbleMe</title>
  <style>
    :root {
      --bg: #0f1012;
      --panel: #17191d;
      --text: #f4f6fa;
      --muted: #a9afbd;
      --accent: #38d3a7;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 10% 10%, #1c2028 0%, var(--bg) 55%);
      color: var(--text);
      line-height: 1.55;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }
    .card {
      background: linear-gradient(180deg, #1b1f27 0%, var(--panel) 100%);
      border: 1px solid #2a2f3a;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.32);
    }
    h1, h2 {
      margin: 0 0 10px;
    }
    h1 { font-size: 28px; }
    h2 { font-size: 18px; color: var(--accent); }
    p, li { color: var(--muted); }
    ul { margin: 8px 0 0 18px; }
    .slider {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .slider-nav {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      border: 1px solid #313748;
      border-radius: 50%;
      background: #12141a;
      color: var(--text);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }
    .viewport {
      width: min(240px, 64vw);
      aspect-ratio: 9 / 19.5;
      border-radius: 12px;
      border: 1px solid #313748;
      background: #0b0c0f;
      overflow: hidden;
    }
    .track {
      display: flex;
      height: 100%;
      transition: transform 0.28s ease;
    }
    .slide {
      flex: 0 0 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slide img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }
    .dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 12px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border: 0;
      border-radius: 50%;
      background: #3a4150;
      padding: 0;
      cursor: pointer;
    }
    .dot.active { background: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>BubbleMe</h1>
      <p>BubbleMe là một tweak mang trải nghiệm App Bubbles (bong bóng ứng dụng) của Android lên iOS 15+.</p>
    </div>

    <div class="card">
      <h2>Cách sử dụng</h2>
      <p>Chạy tất cả các app dưới dạng bong bóng bằng nhiều cách: menu haptic, menu đa nhiệm, banner thông báo.</p>
    </div>

    <div class="card">
      <h2>Ảnh chụp màn hình</h2>
      <div class="slider" data-slider>
        <button class="slider-nav" type="button" data-prev aria-label="Ảnh trước">‹</button>
        <div class="viewport">
          <div class="track">
            <div class="slide"><img src="images/BM_1.png" alt="BubbleMe — cửa sổ bong bóng Messenger"></div>
            <div class="slide"><img src="images/BM_2.png" alt="BubbleMe — ảnh chụp màn hình 2"></div>
            <div class="slide"><img src="images/BM_3.png" alt="BubbleMe — ảnh chụp màn hình 3"></div>
            <div class="slide"><img src="images/BM_4.png" alt="BubbleMe — ảnh chụp màn hình 4"></div>
            <div class="slide"><img src="images/BM_5.png" alt="BubbleMe — ảnh chụp màn hình 5"></div>
          </div>
        </div>
        <button class="slider-nav" type="button" data-next aria-label="Ảnh sau">›</button>
      </div>
      <div class="dots" data-dots></div>
    </div>
  </div>
  <script>
    (function () {
      var root = document.querySelector("[data-slider]");
      if (!root) return;
      var track = root.querySelector(".track");
      var slides = root.querySelectorAll(".slide");
      var dotsWrap = document.querySelector("[data-dots]");
      var index = 0;
      var startX = 0;

      function go(next) {
        index = (next + slides.length) % slides.length;
        track.style.transform = "translateX(" + (-index * 100) + "%)";
        var dots = dotsWrap.querySelectorAll(".dot");
        for (var i = 0; i < dots.length; i++) {
          dots[i].className = i === index ? "dot active" : "dot";
        }
      }

      for (var i = 0; i < slides.length; i++) {
        var dot = document.createElement("button");
        dot.type = "button";
        dot.className = i === 0 ? "dot active" : "dot";
        dot.setAttribute("aria-label", "Ảnh " + (i + 1));
        (function (n) { dot.onclick = function () { go(n); }; })(i);
        dotsWrap.appendChild(dot);
      }

      root.querySelector("[data-prev]").onclick = function () { go(index - 1); };
      root.querySelector("[data-next]").onclick = function () { go(index + 1); };

      root.addEventListener("touchstart", function (e) {
        startX = e.changedTouches[0].clientX;
      }, { passive: true });
      root.addEventListener("touchend", function (e) {
        var dx = e.changedTouches[0].clientX - startX;
        if (Math.abs(dx) > 40) go(index + (dx < 0 ? 1 : -1));
      }, { passive: true });
    })();
  </script>
</body>
</html>
